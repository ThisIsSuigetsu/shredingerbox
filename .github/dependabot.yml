# Раз в месяц GitHub проверяет новые версии шагов сборки (GitHub Actions) и открывает один
# pull request с новыми хешами коммитов. Пока его не приняли (Merge), ничего не меняется.
# Перед принятием - проверить новые версии на сообщения о взломе.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Сборка"
